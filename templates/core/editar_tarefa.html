
{% extends 'core/base.html' %}

{% block title %}Editar Tarefa | Organizador Acadêmico{% endblock %}

{% block content %}

<section class="welcome">
    <h2>✏️ Editar tarefa</h2>
    <p>Atualize as informações da sua atividade acadêmica.</p>
</section>

<section class="activities">

    <div class="form-header">
        <h3>Informações da tarefa</h3>
        <p>Modifique os campos que deseja atualizar.</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div>
            <label for="titulo">Título da tarefa</label>
            <input
                type="text"
                id="titulo"
                name="titulo"
                value="{{ tarefa.titulo }}"
                required
            >
        </div>

        <div>
            <label for="descricao">Descrição</label>
            <textarea
                id="descricao"
                name="descricao"
                rows="5"
            >{{ tarefa.descricao }}</textarea>
        </div>

        <div>
            <label for="disciplina">Disciplina</label>
            <select id="disciplina" name="disciplina">
                <option value="">Selecione uma disciplina</option>

                {% for disciplina in disciplinas %}
                    <option
                        value="{{ disciplina.id }}"
                        {% if tarefa.disciplina_id == disciplina.id %}selected{% endif %}
                    >
                        {{ disciplina.nome }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div>
            <label for="data_entrega">Data de entrega</label>
            <input
                type="date"
                id="data_entrega"
                name="data_entrega"
                value="{{ tarefa.data_entrega|date:'Y-m-d' }}"
            >
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">
                ✓ Salvar alterações
            </button>

            <a href="{% url 'tarefas' %}" class="btn-secondary">
                Voltar
            </a>
        </div>

    </form>

</section>

<style>
    .form-header {
        margin-bottom: 28px;
    }

    .form-header h3 {
        color: #172554;
        font-size: 20px;
        margin-bottom: 8px;
    }

    .form-header p {
        color: #718096;
        font-size: 14px;
    }

    .activities form .form-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
    }

    .activities form .form-actions button,
    .activities form .form-actions a {
        margin: 0;
        text-decoration: none;
    }

    @media (max-width: 600px) {
        .activities form .form-actions {
            flex-direction: column;
            align-items: stretch;
        }

        .activities form .form-actions button,
        .activities form .form-actions a {
            width: 100%;
            text-align: center;
        }
    }
</style>

{% endblock %}
