
{% extends 'core/base.html' %}

{% block title %}Editar Disciplina | Organizador Acadêmico{% endblock %}

{% block content %}

<section class="welcome">
    <h2>✏️ Editar disciplina</h2>
    <p>Atualize as informações da sua disciplina.</p>
</section>

<section class="activities">

    <div class="form-header">
        <h3>Informações da disciplina</h3>
        <p>Modifique os campos que deseja atualizar.</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        <div>
            <label for="nome">Nome da disciplina</label>
            <input type="text" id="nome" name="nome" value="{{ disciplina.nome }}" required>
        </div>

        <div>
            <label for="professor">Nome do professor</label>
            <input type="text" id="professor" name="professor" value="{{ disciplina.professor }}" required>
        </div>

        <div>
            <label for="codigo">Código da disciplina</label>
            <input type="text" id="codigo" name="codigo" value="{{ disciplina.codigo }}" required>
        </div>

        <div>
            <label for="semestre">Semestre</label>
            <input type="text" id="semestre" name="semestre" value="{{ disciplina.semestre }}" required>
        </div>

        <div>
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="5">{{ disciplina.descricao }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">✓ Salvar alterações</button>
            <a href="{% url 'disciplinas' %}" class="btn-secondary">Voltar</a>
        </div>
    </form>
</section>

<style>
.form-header {
    margin-bottom: 28px;
}

.form-header h3 {
    color: #172554;
    font-size: 20px;
    margin-bottom: 8px;
}

.form-header p {
    color: #718096;
    font-size: 14px;
}

.activities form .form-actions {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 28px;
}

.activities form .form-actions button,
.activities form .form-actions a {
    margin: 0;
    text-decoration: none;
}

@media (max-width: 600px) {
    .activities form .form-actions {
        flex-direction: column;
        align-items: stretch;
    }

    .activities form .form-actions button,
    .activities form .form-actions a {
        width: 100%;
        text-align: center;
    }
}
</style>

{% endblock %}
