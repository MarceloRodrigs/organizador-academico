
{% extends 'core/base.html' %}

{% block title %}Editar Nota | Organizador Acadêmico{% endblock %}

{% block content %}

<section class="welcome">
    <h2>✏️ Editar Nota</h2>
    <p>Atualize as informações da sua avaliação.</p>
</section>

<section class="activities">

    <div class="activity-card">

        {% if erro %}
            <div class="alert alert-danger">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="titulo">Nome da avaliação</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    value="{{ nota.titulo }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="disciplina">Disciplina</label>
                <select id="disciplina" name="disciplina" required>

                    {% for disciplina in disciplinas %}
                    <option
                        value="{{ disciplina.id }}"
                        {% if nota.disciplina.id == disciplina.id %}selected{% endif %}
                    >
                        {{ disciplina.nome }}
                    </option>
                    {% endfor %}

                </select>
            </div>

            <div class="form-group">
                <label for="valor">Nota (0 a 10)</label>
                <input
                    type="number"
                    id="valor"
                    name="valor"
                    min="0"
                    max="10"
                    step="0.01"
                    value="{{ nota.valor }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="peso">Peso da avaliação</label>
                <input
                    type="number"
                    id="peso"
                    name="peso"
                    min="0.01"
                    step="0.01"
                    value="{{ nota.peso }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="data_avaliacao">Data da avaliação</label>
                <input
                    type="date"
                    id="data_avaliacao"
                    name="data_avaliacao"
                    value="{{ nota.data_avaliacao|date:'Y-m-d' }}"
                >
            </div>

            <div class="form-group">
                <label for="descricao">Descrição (opcional)</label>
                <textarea
                    id="descricao"
                    name="descricao"
                    rows="4"
                >{{ nota.descricao }}</textarea>
            </div>

            <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px;">

                <button type="submit" class="btn-primary">
                    Salvar alterações
                </button>

                <a href="{% url 'notas' %}" class="btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
